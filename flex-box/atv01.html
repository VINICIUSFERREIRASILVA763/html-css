<!doctype html>
<html lang="pt-br">
  <head>
    <meta name="althor" content="Vinicius Ferreira" />
    <meta
      name="description"
      content="atividade pratica de aprendisado de como usar flexbox"
    />
    <meta charset="UTF-8" />
    <title>atv01 flexbox</title>
    <style>
      .flexbox {
        border: 4px solid rgb(255, 31, 31);
        height: 250px;
        display: flex;
        margin-bottom: 16px;
      }
      .flexbox div {
        border: 2px solid orange;
        width: 300px;
        margin: 15px;
      }
      .flex-conteiner1{
        flex-wrap: wrap;
        flex-direction:row ;
      }
      .flex-conteiner2{
       justify-content: space-around;
       align-content: baseline
      }
      .flex-conteiner2 div{
        width: 30px;
      }
            .flex-conteiner3{
       justify-content: flex-end;
       align-items:50px;
       flex-direction: row;
       height: 400px;
      }
      .flex-conteiner3 div{
        background-color: yellow;
        width: 50px;

        height: 50px;
      }
      .flex-conteiner3 .div2{
       flex-basis: 200px;
      }
      .flex-conteiner3 .div3{
       flex-grow:1;
       flex-shrink: 2;
      }
     .flex-conteiner4 div{
      background-color: green;
     }
     .flex-conteiner4 .div2{
      order: 1;
     }
    </style>
  </head>
  
  <body>
    <div class="flexbox flex-conteiner1">
      <div class="div1">1</div>
      <div class="div2">2</div>
      <div class="div3">3</div>
      <div class="div4">4</div>
    </div>
    <body>
    <div class="flexbox flex-conteiner2">
      <div class="div1">1</div>
      <div class="div2">2</div>
      <div class="div3">3</div>
      <div class="div4">4</div>
    </div>
    <div class="flexbox flex-conteiner3">
      <div class="div1">1</div>
      <div class="div2">2</div>
      <div class="div3">3</div>
      <div class="div4">4</div>
      </div>
    <div class="flexbox flex-conteiner4">
      <div class="div1">1</div>
      <div class="div2">2</div>
      <div class="div3">3</div>
      <div class="div4">4</div>
    </div>
  </body>
</html>
